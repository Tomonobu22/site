<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacman</title>
    <link rel="icon" href="../images/icon.png">

    <!-- Fonts and shared site stylesheet -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <!-- Game specific styles (load after shared styles so they can override) -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="https://kit.fontawesome.com/cdbba87284.js" crossorigin="anonymous"></script>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body class="theme">
    <nav id="navigation" class="navbar navbar-expand-lg navbar-dark bckTop px-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <img src="../images/icon.png" alt="logo" width="auto" height="30" style="filter:brightness(2.5)" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                    aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto align-items-lg-center">
                    <a class="nav-link" href="../index.html">Home</a>
                    <!--<a class="nav-link" href="#">About</a>
                    <a class="nav-link" href="#">Portfolio</a>
                    <a class="nav-link" href="#">Contact</a>-->
                </div>
            </div>
        </div>
    </nav>

    <div class="row justify-content-center mt-4">
        <div class="col-md-10 col-lg-8">
            <div class="shadow-sm border-0 glass">
                <!-- Game content -->
                <div class="content">
                    <div id="game">
                        <div id="gameOver" style="display:none;"></div>
                        <header class="header d-flex justify-content-between align-items-center mb-3">
                            <h1 class="h4 mb-0">Pacman</h1>
                            <div class="score-board text-end">
                                <span class="d-block small">Score</span>
                                <strong id="score">0</strong>
                            </div>
                        </header>

                        <section class="game-container">
                            <div id="overlay" class="mb-2">
                                <button id="start-btn" class="btn btn-primary me-2">Start Game</button>
                                <button id="pause-btn" class="btn btn-danger hidden">Pause</button>
                            </div>

                            <div id="grid" class="grid mb-3"></div>

                            <div id="power-container">
                                <div id="power-bar"></div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 mx-4 border-top">
        <div class="col-md-4 d-flex align-items-center">
            <span class="mb-3 mb-md-0 text-muted">© 2025 Tomonobu Fukuhara</span>
        </div>

        <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
            <li class="ms-3"><a class="text-muted" href="https://github.com/Tomonobu22/site.git" target="_blank"><i class="fab fa-github" style="font-size: 24px;"></i></a></li>
            <li class="ms-3"><a class="text-muted" href="https://www.linkedin.com/in/tomonobu-fukuhara-tengan/" target="_blank"><i class="fab fa-linkedin" style="font-size: 24px;"></i></a></li>
        </ul>
    </footer>

    <script type="module" src="./js/main.js"></script>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
